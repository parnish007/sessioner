[project]
name = "sessioner"
version = "0.1.0"
description = "Automatic Claude Code account switching with guided terminal setup"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "rich>=14,<16",
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
    "keyring>=25.0.0; sys_platform == 'win32'",
]

[project.scripts]
sessioner = "sessioner.cli:main"
sessioner-accounts = "sessioner.accounts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessioner"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
