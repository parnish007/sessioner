[project]
name = "sessioner"
version = "0.1.0"
description = "Automatic Claude Code account switching with guided terminal setup"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "claude-swap==0.27.0b1",
    "rich>=14,<16",
]

[project.scripts]
sessioner = "sessioner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessioner"]

[tool.uv.sources]
claude-swap = {path = "vendor/claude-swap", editable = true}

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
